<section class="contenido">
  <h1>Artistas invitados</h1>
  <p>Algunos de los grupos que se presentan en el festival (nombres de ejemplo).</p>

  <div class="tarjetas">
    @for (a of artistas; track a.nombre) {
      <div class="tarjeta">
        <img [src]="a.imagen" [alt]="a.nombre" />
        <div class="tarjeta-texto">
          <p class="etiqueta">{{ a.tipo }}</p>
          <h3>{{ a.nombre }}</h3>
          <p>{{ a.descripcion }}</p>
        </div>
      </div>
    }
  </div>
</section>
